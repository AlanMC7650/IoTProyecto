# AquaControl con Docker
#   docker compose up -d --build                  -> BD + servidor (web y API) en http://localhost:3000
#   docker compose --profile esp32 up -d --build  -> además la API tipo Supabase para el ESP32 (puerto 8000)
# Variables opcionales: copiar .env.example a .env (ver DOCKER.md)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-iot}
      # Mismo huso que usa BD.sql para el "consumo de hoy"
      TZ: America/La_Paz
    volumes:
      - db_data:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (con el volumen vacío)
      - ./docker/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./BD.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
    # Solo para conectarse desde la PC (pgAdmin, psql). 5433 para no chocar
    # con un Postgres instalado localmente en el 5432.
    ports:
      - "127.0.0.1:${DB_PUBLIC_PORT:-5433}:5432"
    healthcheck:
      # -h localhost: durante la inicialización Postgres solo escucha por socket,
      # así el servicio no se marca sano hasta que BD.sql terminó
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  back:
    build:
      context: .
      dockerfile: Back/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-iot}
      DB_SSL: "false"
      DB_LOGGING: ${DB_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET:-cambiar_esta_clave_en_produccion}
      PORT: 3000
    ports:
      - "${BACK_PORT:-3000}:3000"

  # --- Perfil esp32: reemplazo local de la API REST de Supabase ---------------
  postgrest:
    image: postgrest/postgrest:v12.2.3
    profiles: ["esp32"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-iot}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon

  api-esp32:
    image: nginx:1.27-alpine
    profiles: ["esp32"]
    restart: unless-stopped
    depends_on:
      - postgrest
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ESP32_API_PORT:-8000}:80"

volumes:
  db_data:
